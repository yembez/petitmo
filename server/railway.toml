# Service Railway : définir la racine du service sur le dossier `server/`
# (Settings → Root Directory = server).
#
# Le Dockerfile utilise l’image Playwright officielle (Chromium aligné sur playwright@1.59.1).
# Ne pas fixer PORT ici : Railway injecte la variable PORT au runtime.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
